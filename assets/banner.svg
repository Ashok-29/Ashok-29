<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="1200" height="220" role="img" aria-label="Ashok Kambaluru — Assistant Professor and Aspiring ML & Computer Vision Engineer">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="55%" stop-color="#1B263B"/>
      <stop offset="100%" stop-color="#1E3A5F"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="220" rx="14" fill="url(#bg)"/>
  <!-- Subtle geometric grid lines on right -->
  <g stroke="#38BDF8" stroke-opacity="0.12" stroke-width="1">
    <line x1="860" y1="0" x2="860" y2="220"/>
    <line x1="940" y1="0" x2="940" y2="220"/>
    <line x1="1020" y1="0" x2="1020" y2="220"/>
    <line x1="1100" y1="0" x2="1100" y2="220"/>
    <line x1="820" y1="55" x2="1200" y2="55"/>
    <line x1="820" y1="110" x2="1200" y2="110"/>
    <line x1="820" y1="165" x2="1200" y2="165"/>
  </g>
  <!-- Subtle neural node accents -->
  <g fill="#38BDF8" fill-opacity="0.45">
    <circle cx="940" cy="55" r="4"/>
    <circle cx="1020" cy="110" r="5"/>
    <circle cx="1100" cy="55" r="4"/>
    <circle cx="1100" cy="165" r="4"/>
    <circle cx="940" cy="165" r="3.5"/>
  </g>
  <g stroke="#818CF8" stroke-opacity="0.35" stroke-width="1.5">
    <line x1="940" y1="55" x2="1020" y2="110"/>
    <line x1="940" y1="165" x2="1020" y2="110"/>
    <line x1="1020" y1="110" x2="1100" y2="55"/>
    <line x1="1020" y1="110" x2="1100" y2="165"/>
  </g>
  <!-- Left accent bar -->
  <rect x="48" y="48" width="5" height="124" rx="2.5" fill="url(#accent)"/>
  <!-- Typography -->
  <text x="76" y="102" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="42" font-weight="700" letter-spacing="0.5">Ashok Kambaluru</text>
  <text x="76" y="138" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="500">Assistant Professor · Aspiring Machine Learning &amp; Computer Vision Engineer</text>
  <text x="76" y="168" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">PyTorch  |  Deep Learning  |  Computer Vision  |  Medical Imaging  |  Explainable AI</text>
</svg>
